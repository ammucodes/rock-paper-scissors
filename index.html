    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
            <div class="container">
                <h1>Rock Paper Scissors</h1>

                <button class="rock-btn move-btn"><img src="images/rock-emoji.png" alt="rock-emoji" class="move-icon"></button>

                <button class="paper-btn move-btn"><img src="images/paper-emoji.png" alt="paper-emoji" class="move-icon"></button>
                
                <button class="scissors-btn move-btn"><img src="images/scissors-emoji.png" alt="scissors-emoji" class="move-icon"></button>

                <p class="choices"></p>
                <p class="results"></p>
                <p class="scores"></p>

                <button class="reset-btn">Reset Scores</button>
            
            </div>
        <script src="script.js"></script>
    </body>
    </html>
